<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#69b84f"><title>Unit 4 Vokabeln</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:linear-gradient(#eaffdf,#fff);color:#183515}.app{max-width:640px;margin:auto;padding:20px 16px 96px}h1{font-size:36px;line-height:.95}.card{background:white;border-radius:28px;padding:22px;margin:14px 0;text-align:center;box-shadow:0 16px 40px #0002}button{width:100%;border:0;border-radius:20px;padding:16px;margin:8px 0;font-size:19px;font-weight:900;background:#69b84f;color:white;box-shadow:0 7px 0 #3f8f2f}.secondary{background:white;color:#183515;border:2px solid #d9efd2;box-shadow:0 7px 0 #c6dfbf}.blue{background:#5aa9ff;box-shadow:0 7px 0 #327bc7}.purple{background:#a179ff;box-shadow:0 7px 0 #7050cb}.danger{background:#ff6b6b;box-shadow:0 7px 0 #cf4d4d}.hidden{display:none}.big{font-size:34px;font-weight:900;word-break:break-word}.emoji{font-size:52px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{font-size:15px;min-height:82px;line-height:1.2}.units{display:grid;gap:10px}.selected{outline:4px solid #ffd65c}input{width:100%;padding:15px;border-radius:16px;border:2px solid #d9efd2;font-size:18px;text-align:center;box-sizing:border-box}.tabs{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#ffffffdd;padding:9px}.tabs button{font-size:13px;padding:12px 2px;box-shadow:none;background:#eef7ea;color:#183515}.list{max-height:460px;overflow:auto;text-align:left}.row{display:grid;grid-template-columns:38px 1fr 1fr;gap:8px;padding:10px;border-bottom:1px solid #edf5e8}.row b,.row span{font-size:14px;line-height:1.25}.row span{color:#5f7457}.pill{float:right;background:#fff;border-radius:999px;padding:10px 15px;box-shadow:0 6px 18px #0001;font-weight:900}</style></head><body><div class="app"><div class="pill">⭐ <span id="stars">0</span></div><h1>Unit 4<br>Vokabeln</h1><section id="home" class="card"><div class="emoji">🇬🇧🎮</div><div class="big">100% deiner Datei</div><p>Vocabulary Sheet 19 & 20<br><b>95</b> Vokabeln und Redewendungen</p><button data-a="quiz">🎮 Quiz starten</button><button class="blue" data-a="type">⌨️ Schreib-Test</button><button class="purple" data-a="flash">🃏 Karteikarten</button><button class="secondary" data-a="browse">📚 Wörterliste</button></section><section id="units" class="card hidden"><h2>Bereich wählen</h2><div id="unitBtns" class="units"></div><button data-a="begin">Start</button><button class="secondary" data-a="home">Zurück</button></section><section id="quiz" class="card hidden"><p id="qinfo"></p><div id="qemoji" class="emoji"></div><p id="qmode"></p><div id="qword" class="big"></div><div id="answers" class="grid"></div><h2 id="feed"></h2><button class="secondary" data-a="speak">🔊 Anhören</button><button class="danger" data-a="home">Beenden</button></section><section id="type" class="card hidden"><p id="tinfo"></p><div id="temoji" class="emoji"></div><p>Schreibe Englisch</p><div id="tword" class="big"></div><input id="inp" autocomplete="off" autocapitalize="none"><button data-a="check">Prüfen</button><h2 id="tfeed"></h2><button class="danger" data-a="home">Beenden</button></section><section id="flash" class="card hidden"><h2>Karteikarten</h2><div id="femoji" class="emoji"></div><div id="fword" class="big"></div><p id="funit"></p><button data-a="next">Nächste Karte</button><button class="secondary" data-a="flip">Antwort</button><button class="secondary" data-a="speakf">🔊 Anhören</button><button class="secondary" data-a="home">Zurück</button></section><section id="browse" class="card hidden"><h2>Wörterliste</h2><div id="browseBtns" class="units"></div><div id="wordList" class="list"></div><button class="secondary" data-a="home">Zurück</button></section></div><div class="tabs"><button data-a="home">🏠 Start</button><button data-a="quiz">🎮 Quiz</button><button data-a="type">⌨️ Test</button><button data-a="flash">🃏 Karten</button></div><script>const S={"Unit 4 Sheet 19": [["to mean", "bedeuten; meinen", "💬"], ["winner", "Gewinner/-in; Sieger/-in", "🏆"], ["tourist", "Tourist", "🧳"], ["line", "Zeile; Linie", "📏"], ["to turn into", "einbiegen; abbiegen", "↪️"], ["left", "(nach) links; linke/r/s", "⬅️"], ["Turn left into Green Road.", "Biege links in die Green Road ab.", "⬅️"], ["right", "(nach) rechts; rechte/r/s", "➡️"], ["straight on", "geradeaus", "⬆️"], ["I don't know.", "Ich weiß (es) nicht.", "🤷"], ["stop", "Halt; Stopp", "🛑"], ["tourist information centre", "Touristeninformation", "ℹ️"], ["market", "Markt", "🧺"], ["You can shop in shops or at the market.", "Du kannst in Geschäften oder auf dem Markt einkaufen gehen.", "🛍️"], ["to go down", "entlanggehen; hinuntergehen", "⬇️"], ["past", "vorbei (an); vorüber (an)", "➡️"], ["opposite", "gegenüber; auf der anderen Seite", "↔️"], ["The school is opposite my house.", "Die Schule ist gegenüber meinem Haus.", "🏫"], ["café", "Café", "☕"], ["theatre", "Theater", "🎭"], ["Is there a theatre in your town?", "Gibt es in deiner Stadt ein Theater?", "🎭"], ["shopping", "Einkaufen; Einkäufe", "🛍️"], ["Greenwich is great for shopping.", "Greenwich ist toll zum Shoppen.", "🛍️"], ["cinema", "Kino", "🎬"], ["church", "Kirche", "⛪"], ["Let's look at the map.", "Lass(t) uns auf den Stadtplan / die Karte schauen.", "🗺️"], ["Where is ...?", "Wo ist ...?", "❓"], ["Look, it's over there / in East Street / ...", "Schau, es ist dort drüben / in der East Street / ...", "👀"], ["Are you sure?", "Bist du sicher?", "❓"], ["No, let's ask someone.", "Nein, lass(t) uns jemanden fragen.", "🙋"], ["Excuse me, please.", "Entschuldigung. / Entschuldigen Sie.", "🙋"], ["Can you tell me/us the way to ...?", "Können Sie mir/uns sagen, wie man zum ... kommt?", "🗺️"], ["Wait a minute ... oh, yes.", "Einen Augenblick ... oh, ja ...", "⏳"], ["Go down ...", "Geh/Geht/Gehen Sie ... entlang.", "⬇️"], ["Turn right/left into ...", "Bieg/Biegt/Biegen Sie rechts/links in ... ab.", "↪️"], ["Go straight on.", "Geh/Geht/Gehen Sie geradeaus.", "⬆️"], ["Go past ...", "Geh/Geht/Gehen Sie am ... vorbei.", "➡️"], ["It's on the right/left.", "Es befindet sich auf der rechten/linken Seite.", "↔️"], ["It's opposite ...", "Es befindet sich gegenüber ...", "↔️"], ["Thank you.", "Vielen Dank.", "🙏"], ["You're welcome.", "Keine Ursache. / Gern geschehen.", "🙂"]], "Unit 4 Sheet 20": [["captain", "Kapitän/-in; Mannschaftsführer/-in", "👨‍✈️"], ["Every ship needs a captain.", "Jedes Schiff braucht einen Kapitän.", "🚢"], ["cabin boy", "Schiffsjunge", "🚢"], ["The cabin boy helps on a ship.", "Der Schiffsjunge hilft auf einem Schiff.", "🚢"], ["sea", "Meer", "🌊"], ["sound", "Ton; Geräusch; Klang", "🔊"], ["aboard", "an Bord", "⚓"], ["sailor", "Seemann; Matrose", "⚓"], ["tea", "Tee", "🍵"], ["land", "Land", "🌍"], ["storm", "Sturm", "🌩️"], ["wave", "Welle", "🌊"], ["There are big waves in a storm at sea.", "In einem Sturm auf dem Meer gibt es große Wellen.", "🌊"], ["wheel", "Rad; Steuerrad; Steuer", "⚙️"], ["to reef the sails", "die Segel einholen", "⛵"], ["to climb", "klettern; besteigen; steigen", "🧗"], ["rigging", "Takelage", "⛵"], ["dangerous", "gefährlich", "⚠️"], ["slow", "langsam ↔ schnell", "🐢"], ["brave", "mutig; tapfer", "🦁"], ["to come down", "herunterkommen", "⬇️"], ["mate", "Schiffsoffizier; Maat", "⚓"], ["to drink", "trinken", "🥤"], ["back", "zurück", "↩️"], ["just then", "genau in dem Moment", "⏰"], ["to hit", "schlagen; treffen", "💥"], ["It can be very dangerous when a monster wave hits a ship.", "Es kann sehr gefährlich sein, wenn eine Monsterwelle ein Schiff trifft.", "🌊"], ["to fall", "fallen; hinfallen", "⬇️"], ["Don't fall into the sea, Ben!", "Fall nicht ins Meer, Ben!", "🌊"], ["to save", "retten; bergen", "🛟"], ["lifebuoy", "Rettungsring", "🛟"], ["lifeboat", "Rettungsboot", "🚤"], ["to jump", "springen", "🦘"], ["to stay", "bleiben", "🧍"], ["to be wrong", "Unrecht haben; sich irren ↔ Recht haben", "❌"], ["that's how", "so", "➡️"], ["Look at Luke! That's how you play football – he's good!", "Guck dir Luke an! So spielt man Fußball – er ist gut!", "⚽"], ["to find out", "herausfinden", "🔎"], ["to be wrong", "unrecht haben; sich irren", "❌"], ["to be sorry", "leid tun", "🙏"], ["to make", "hier: ergeben", "➕"], ["Brave people make good sailors.", "Tapfere Leute ergeben gute Seeleute.", "⚓"], ["very much", "sehr (z. B. in Danke sehr!)", "🙏"], ["to remember", "sich erinnern an; sich merken; denken an", "🧠"], ["Do you remember the cabin boy's name?", "Erinnerst du dich an den Namen des Schiffsjungen?", "❓"], ["trip", "Trip; Reise; Ausflug; Fahrt", "🧳"], ["GPS device", "GPS-Gerät", "📍"], ["cache", "Versteck; geheimes Lager", "📦"], ["out", "außerhalb; hinaus; heraus; draußen", "➡️"], ["coin", "Münze", "🪙"], ["first aid kit", "Erste-Hilfe-Kasten", "🩹"], ["I'd like to ...", "Ich möchte ... / Ich würde gerne ...", "🙏"], ["to fall down", "herunterfallen; hinunterfallen", "⬇️"], ["to need to do", "(tun) müssen", "✅"]]};let keys=Object.keys(S),sec=keys[0],mode='quiz',cur=null,corr='',opts=[],stars=+localStorage.unit4stars||0,q=0,t=0,flash=null,showAns=false;const $=id=>document.getElementById(id);function show(id){['home','units','quiz','type','flash','browse'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');$('stars').textContent=stars}function renderUnits(){$('unitBtns').innerHTML=keys.map(k=>`<button class="secondary ${k==sec?'selected':''}" data-sec="${k}">${k}<br><small>${S[k].length} Wörter</small></button>`).join('')}function choose(k){sec=k;renderUnits()}function openMode(m){mode=m;renderUnits();show('units')}function pool(){return S[sec]}function sh(a){return [...a].sort(()=>Math.random()-.5)}function begin(){q=0;t=0;mode=='quiz'?newQ():newT()}function newQ(){show('quiz');q++;cur=pool()[Math.floor(Math.random()*pool().length)];let en=Math.random()<.6;corr=en?cur[1]:cur[0];$('qinfo').textContent=sec+' · Frage '+q+'/10';$('qemoji').textContent=cur[2];$('qmode').textContent=en?'Was heißt auf Deutsch?':'Wie heißt auf Englisch?';$('qword').textContent=en?cur[0]:cur[1];let o=[corr];let guard=0;while(o.length<4&&guard<100){guard++;let w=pool()[Math.floor(Math.random()*pool().length)],x=en?w[1]:w[0];if(!o.includes(x))o.push(x)}opts=sh(o);$('answers').innerHTML=opts.map((x,i)=>`<button class="answer secondary" data-ans="${i}">${x}</button>`).join('');$('feed').textContent=''}function ans(i){if(opts[i]==corr){stars+=3;localStorage.unit4stars=stars;$('feed').textContent='✅ Super!';speak(cur[0]);setTimeout(newQ,800)}else{$('feed').textContent='❌ Richtig: '+corr;setTimeout(newQ,1800)}}function newT(){show('type');t++;cur=pool()[Math.floor(Math.random()*pool().length)];$('tinfo').textContent=sec+' · Frage '+t+'/8';$('temoji').textContent=cur[2];$('tword').textContent=cur[1];$('inp').value='';$('tfeed').textContent='';setTimeout(()=>$('inp').focus(),100)}function norm(s){return s.toLowerCase().trim().replace(/[.!?]/g,'').replace(/\s+/g,' ')}function check(){if(norm($('inp').value)==norm(cur[0])){stars+=5;localStorage.unit4stars=stars;$('tfeed').textContent='✅ Perfekt!';speak(cur[0]);setTimeout(newT,900)}else{$('tfeed').textContent='❌ Lösung: '+cur[0];speak(cur[0]);setTimeout(newT,2300)}}function cards(){return keys.flatMap(k=>S[k].map(w=>[...w,k]))}function next(){let c=cards();flash=c[Math.floor(Math.random()*c.length)];showAns=false;$('femoji').textContent=flash[2];$('fword').textContent=flash[0];$('funit').textContent=flash[3]}function flip(){showAns=!showAns;$('fword').textContent=showAns?flash[1]:flash[0]}function browse(){$('browseBtns').innerHTML=keys.map(k=>`<button class="secondary" data-browse="${k}">${k}<br><small>${S[k].length} Wörter</small></button>`).join('');list(sec);show('browse')}function list(k){sec=k;$('wordList').innerHTML=S[k].map(w=>`<div class="row"><div>${w[2]}</div><b>${w[0]}</b><span>${w[1]}</span></div>`).join('')}function speak(x){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.sec)return choose(b.dataset.sec);if(b.dataset.browse)return list(b.dataset.browse);if(b.dataset.ans)return ans(+b.dataset.ans);let a=b.dataset.a;if(a=='home')show('home');if(a=='quiz')openMode('quiz');if(a=='type')openMode('type');if(a=='begin')begin();if(a=='check')check();if(a=='flash'){show('flash');next()}if(a=='next')next();if(a=='flip')flip();if(a=='browse')browse();if(a=='speak')speak(cur?cur[0]:'');if(a=='speakf')speak(flash?flash[0]:'')});$('inp').addEventListener('keydown',e=>{if(e.key=='Enter')check()});$('stars').textContent=stars;renderUnits();</script></body></html>
